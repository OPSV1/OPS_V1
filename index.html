 ◀ ▶.</li><li>Ketuk kartu angka atau baris tabel untuk melihat detail. Persentase menunjukkan perubahan dibanding periode sebelumnya.</li><li>Kartu <b>Hari ini</b> menampilkan jumlah mobil 5 ton dan 10 ton yang jalan, serta foto dokumentasi.</li><li><b>Rekap per Kapal</b>: rit truk 5 ton dan 10 ton per kapal dan PT; ketuk baris untuk melihat per supir.</li><li><b>Riwayat</b>: seluruh rit. Ketuk 🖼 untuk melihat foto, <b>Harga</b> untuk mengisi harga rit supir, <b>Hapus</b> untuk menghapus.</li></ol>`)+S("5. Panduan Supir",0,`<div class="card"><span class="pin">📍</span> <span class="tag g2 pl">GPS aktif</span></div><ol><li>Masuk dengan akun supir. Izinkan lokasi saat browser meminta, lalu tekan <b>Aktifkan GPS</b> bila perlu.</li><li>Tanpa GPS aktif halaman terkunci. Biarkan aplikasi terbuka selama bertugas.</li><li>Pada order yang tampil, pilih <b>Isi dengan truk</b> (5 ton atau 10 ton).</li><li>Tekan <b>Buka kamera &amp; kirim dokumentasi</b>. Stempel supir, rit ke-, armada, kapal, perusahaan, alamat lokasi, tanggal &amp; waktu langsung tampil di kamera. Tekan tombol bulat putih untuk memotret, foto langsung terkirim sebagai satu rit.</li></ol>${tip('Jika order kapal tidak ada di daftar, tanyakan ke admin; atau pilih "ketik manual".')}`)+S("6. Inventory",0,`<ol><li><b>Impor stok awal</b>: Daftar Barang → pilih file Excel. Contoh judul kolom: <i>Kode, Nama Barang, Jumlah, Satuan, Lokasi</i>. Periksa <b>Pratinjau</b>, lalu <b>Impor Sekarang</b>.</li><li><b>Barang Masuk / Keluar</b>: pilih tab, pilih barang, isi jumlah, <b>Simpan</b>. Stok berubah otomatis.</li><li><b>Scan Opname</b>: tekan <b>Buka Kamera</b> dan arahkan ke barcode (atau pakai alat scan/ketik kode lalu Enter). Isi stok fisik, <b>Simpan Opname</b>; selisih tercatat.</li><li><b>Dashboard</b>: lihat barang menipis, habis, dan lokasinya.</li></ol>${tip("Kamera scan butuh Chrome di Android. Jika tidak ada, pakai alat scan atau ketik kode.")}`)+S("7. Trucking",0,`<ol><li><b>Rekap Supir</b>: pilih periode, lihat rit, ton, dan fee tiap supir; ketuk baris untuk rincian.</li><li><b>Data & Lokasi Supir</b>: kelola supir dan lihat lokasi terakhir (tautan 📍 membuka peta).</li></ol>`)+S("8. Penawaran Harga",0,`<ol><li>Unggah dokumen contoh (PDF, Word, Excel, teks, atau HTML).</li><li>Periksa hasil deteksi: perusahaan tujuan, harga, kegiatan, tanggal lama. Perbaiki bila salah.</li><li>Isi nilai baru. Tanggal kosong = hari ini.</li><li>Tekan <b>Buat Penawaran</b>, periksa hasilnya.</li><li>Tekan <b>Download PDF / Cetak</b> lalu pilih "Simpan sebagai PDF", atau <b>Kirim</b>.</li></ol>${tip("Hasil berupa teks; tata letak asli dokumen belum ikut.")}`)+S("9. Arus Kas & Laporan",0,`<ol><li><b>Arus Kas → Input</b>: pilih tanggal, jenis (pemasukan/pengeluaran), nama kegiatan, kategori, nominal.</li><li>Di tiap menu, tekan <b>Laporan CSV</b> (dibuka di Excel) atau <b>Cetak / Simpan PDF</b> (memakai logo & watermark perusahaan).</li></ol>`)+S("10. Pesan ke Tim Support",0,`<ol><li>Di bagian bawah tiap menu, tulis kebutuhan atau kendala Anda lalu <b>Kirim</b>.</li><li>Balasan Tim Support muncul di bawah pesan Anda. Anda bisa membalas kembali.</li><li>Pesan yang sudah selesai disembunyikan oleh Tim Support dan bisa dimunculkan lagi bila perlu.</li></ol>`)+S("11. Pengaturan akun & hak akses (admin)",0,`<ol><li><b>Pengaturan → Akun & Hak Akses</b>: isi nama, ID, password, role, lalu <b>Tambah</b>.</li><li>Tekan <b>Hak akses</b> pada akun untuk mencentang menu yang boleh dibuka.</li><li>Admin dapat menghapus kegiatan (rit, order, catatan barang, kas, dll.) lewat tombol <b>Hapus</b>.</li></ol>`)+S("12. Masalah umum",0,`<ol><li><b>GPS tidak aktif</b>: nyalakan lokasi HP, izinkan lokasi untuk browser, tekan Aktifkan GPS.</li><li><b>Kamera tidak terbuka</b>: izinkan kamera di browser.</li><li><b>Data tidak muncul di perangkat lain</b>: data saat ini tersimpan per perangkat; unduh CSV sebagai cadangan.</li><li><b>Tombol tidak bereaksi</b>: muat ulang halaman.</li></ol>`)+(su?S("13. Khusus pengelola",0,`<ol><li><b>Supabase</b>: isi URL dan key, salin SQL yang muncul ke SQL Editor Supabase, lalu jalankan.</li><li><b>Langganan</b>: setujui pengajuan pembayaran atau atur tanggal akhir akses.</li><li><b>Hapus Data</b>: centang data, isi rentang tanggal bila perlu, ketik HAPUS.</li><li><b>Masukan</b>: balas pesan pengguna, tandai selesai.</li></ol>`):""))}const idb=(m,v)=>new Promise(r=>{try{const q=indexedDB.open("nusabg",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onerror=()=>r(null);q.onsuccess=()=>{const o=q.result.transaction("k",m=="get"?"readonly":"readwrite").objectStore("k"),x=m=="get"?o.get("bg"):m=="set"?o.put(v,"bg"):o.delete("bg");x.onsuccess=()=>r(x.result);x.onerror=()=>r(null)}}catch(e){r(null)}});const LITE=()=>{const c=navigator.connection||{},m=q=>window.matchMedia&&matchMedia(q).matches;return!!(c.saveData||/2g|3g/.test(c.effectiveType||"")||m("(prefers-reduced-motion: reduce)")||m("(pointer:coarse) and (max-width:900px)")||window.BATLOW)};try{navigator.getBattery&&navigator.getBattery().then(b=>{const u=()=>{window.BATLOW=!b.charging&&b.level<.2};u();b.addEventListener("levelchange",u);b.addEventListener("chargingchange",u)})}catch(e){}document.addEventListener("visibilitychange",()=>{const v=document.querySelector("#lbg video");if(v){if(document.hidden)v.pause();else v.play().catch(()=>{})}});const bgDef=()=>LITE()?"":`<video autoplay muted loop playsinline preload="metadata"><source src="${BGM}" type="video/mp4"><source src="${BGV}" type="video/webm"></video>`;function playBg(){const v=document.querySelector("#lbg video");if(v){v.muted=true;v.play().catch(()=>{})}}function setBg(src,type){const e=document.getElementById("lbg");if(!e)return;e.innerHTML=!type.startsWith("image")&&LITE()?"":type.startsWith("image")?`<img src="${src}" alt="">`:`<video autoplay muted loop playsinline src="${src}"></video>`;playBg()}const bgCard=()=>`<div class="card"><h3>🎬 Background Halaman Login</h3><p style="color:var(--mu);margin:0 0 8px">Unggah
