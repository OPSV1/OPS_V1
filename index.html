>Pilih <b>Order kapal</b> dan <b>Armada yang dipakai</b> (5 atau 10 ton) untuk rit ini.</li><li>Isi <b>Realisasi (ton)</b>.</li><li>Tekan kolom foto, ambil <b>foto dokumentasi</b> pengisian (wajib).</li><li>Tekan <b>Simpan</b>. Rit hari ini muncul di daftar bawah.</li></ol>${e('Jika order kapal tidak ada di daftar, tanyakan ke admin; atau pilih "ketik manual".')}`)+t("6. Inventory",0,`<ol><li><b>Impor stok awal</b>: Daftar Barang → pilih file Excel. Contoh judul kolom: <i>Kode, Nama Barang, Jumlah, Satuan, Lokasi</i>. Periksa <b>Pratinjau</b>, lalu <b>Impor Sekarang</b>.</li><li><b>Barang Masuk / Keluar</b>: pilih tab, pilih barang, isi jumlah, <b>Simpan</b>. Stok berubah otomatis.</li><li><b>Scan Opname</b>: tekan <b>Buka Kamera</b> dan arahkan ke barcode (atau pakai alat scan/ketik kode lalu Enter). Isi stok fisik, <b>Simpan Opname</b>; selisih tercatat.</li><li><b>Dashboard</b>: lihat barang menipis, habis, dan lokasinya.</li></ol>${e("Kamera scan butuh Chrome di Android. Jika tidak ada, pakai alat scan atau ketik kode.")}`)+t("7. Trucking",0,"<ol><li><b>Rekap Supir</b>: pilih periode, lihat rit, ton, dan fee tiap supir; ketuk baris untuk rincian.</li><li><b>Data & Lokasi Supir</b>: kelola supir dan lihat lokasi terakhir (tautan 📍 membuka peta).</li></ol>")+t("8. Penawaran Harga",0,`<ol><li>Buka <b>Penawaran</b>. Untuk memasukkan penawaran lama, tekan <b>Impor dari Excel</b> dan pilih file quotation (.xls / .xlsx). Tiap sheet menjadi 1 penawaran = 1 halaman A4.</li><li>Atur <b>Katalog Layanan</b> (nama layanan, satuan, harga) di tab Katalog Layanan. Harga katalog dipakai saat membuat penawaran baru.</li><li>Tekan <b>Penawaran Baru</b>, isi nomor, tujuan, dan perihal. Pilih layanan lewat <b>Tambah dari katalog</b> atau ketik manual. Pilih <b>Kop surat</b> (CV atau PT) dan penandatangan.</li><li>Pratinjau di bawah form sama dengan hasil cetak. Tekan <b>Cetak / PDF</b>, lalu pilih "Simpan sebagai PDF".</li></ol>${e("Gambar tanda tangan dan stempel diatur di tab Pena
