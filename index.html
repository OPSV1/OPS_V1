<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>NusaOps</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5fb;--cd:#fff;--tx:#0f172a;--mu:#64748b;--br:#e2e8f0;--ac:#2563eb;--a2:#06b6d4;--ok:#16a34a;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--cd:#151b30;--tx:#e8ecf8;--mu:#8b97b5;--br:#262e4a}}
:root[data-theme=dark]{--bg:#0b1020;--cd:#151b30;--tx:#e8ecf8;--mu:#8b97b5;--br:#262e4a}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
#nav{position:fixed;z-index:5;background:var(--cd);display:flex;gap:2px;overflow-x:auto;bottom:0;left:0;right:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--br)}
#nav button{flex:1;min-width:64px;border:0;background:none;color:var(--mu);padding:6px;border-radius:12px;font:inherit;font-size:11px;cursor:pointer}
#nav button span{display:block;font-size:20px}#nav button.on{background:linear-gradient(135deg,var(--ac),var(--a2));color:#fff}
#main{padding:16px 14px 90px;max-width:1100px;margin:auto}
@media(min-width:800px){#nav{top:0;bottom:auto;right:auto;width:200px;flex-direction:column;border:0;border-right:1px solid var(--br);padding:70px 10px 10px;height:100%}#nav button{flex:none;text-align:left;font-size:14px;display:flex;gap:10px;align-items:center}#nav button span{font-size:18px;display:inline}#main{margin-left:210px;padding-bottom:30px;max-width:none}}
h2{margin:6px 0 12px;font-size:22px}h3{margin:0 0 8px;font-size:15px}
.card{background:var(--cd);border:1px solid var(--br);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.kpi{background:linear-gradient(135deg,var(--ac),var(--a2));color:#fff;border-radius:16px;padding:14px;cursor:pointer;transition:.15s}.kpi:hover{transform:translateY(-2px)}.kpi small{opacity:.85;display:block}.kpi b{font-size:20px}.kpi em{display:block;font-size:12px;font-style:normal;opacity:.9}
.kpi.k2{background:linear-gradient(135deg,#7c3aed,#ec4899)}.kpi.k3{background:linear-gradient(135deg,#f59e0b,#ef4444)}.kpi.k4{background:linear-gradient(135deg,#10b981,#06b6d4)}
label{font-size:12px;color:var(--mu);display:block}input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--br);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button.b{border:0;background:var(--ac);color:#fff;padding:9px 14px;border-radius:10px;font:inherit;cursor:pointer}button.b.s{background:var(--br);color:var(--tx)}button.b.d{background:var(--bad)}button.b.sm{padding:4px 9px;font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{border:1px solid var(--br);background:var(--cd);color:var(--tx);padding:7px 14px;border-radius:99px;cursor:pointer;font:inherit;white-space:nowrap}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;border-bottom:1px solid var(--br);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px}tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}
.bar{display:flex;align-items:flex-end;gap:4px;height:120px}.bar i{flex:1;background:linear-gradient(var(--a2),var(--ac));border-radius:5px 5px 0 0;min-height:2px;position:relative}.bar i u{position:absolute;bottom:-18px;left:0;font-size:9px;color:var(--mu);text-decoration:none}
.up{color:#bbf7d0}.dn{color:#fecaca}.tag{padding:2px 8px;border-radius:99px;background:var(--br);font-size:12px}.tag.r{background:#fee2e2;color:#991b1b}.tag.g2{background:#dcfce7;color:#166534}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}.md>div{background:var(--cd);border-radius:16px;padding:16px;max-width:900px;width:100%;max-height:85vh;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;display:none}
.paper{background:#fff;color:#000;padding:30px;border:1px solid var(--br);white-space:pre-wrap;font:14px/1.6 Georgia,serif;position:relative}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.login{max-width:360px;margin:12vh auto;padding:0 14px}pre.sql{background:#0f172a;color:#a5f3fc;padding:12px;border-radius:12px;overflow:auto;max-height:340px;font-size:12px}
@keyframes grow{0%{width:5%}100%{width:80%}}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.6)}100%{box-shadow:0 0 0 16px rgba(37,99,235,0)}}@keyframes pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.gb{background:var(--br);border-radius:9px;height:12px;overflow:hidden}.gb i{display:block;height:12px;background:linear-gradient(90deg,var(--ac),var(--a2));animation:grow 3s ease-in-out infinite alternate}.pl{animation:pulse 1.4s infinite}.pin{display:inline-block;animation:pin 1.2s infinite;font-size:30px}.tip{background:var(--bg);border-left:4px solid var(--ac);padding:8px 10px;border-radius:8px;margin:8px 0}details{border:1px solid var(--br);border-radius:12px;padding:8px 12px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}ol{padding-left:20px;margin:6px 0}
#lbg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#0b1020}#lbg video,#lbg img{width:100%;height:100%;object-fit:cover}#lbg:after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(11,16,32,.5),rgba(11,16,32,.75))}
.login.gl{background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:rgba(255,255,255,.25)}.login.gl h2,.login.gl p,.login.gl small,.login.gl label{color:#fff}
#wm,.ph{display:none}
@media print{#nav,.np,#toast{display:none!important}#main{margin:0;padding:0}.card{box-shadow:none;border:0}.ph{display:flex;gap:10px;align-items:center;border-bottom:2px solid #000;margin-bottom:10px}.ph img{height:44px}#wm{display:block;position:fixed;inset:0;background-position:center;background-repeat:no-repeat;background-size:50%;opacity:.07;z-index:-1}body{background:#fff;color:#000}.paper{border:0}}
</style></head><body><div id="wm"></div><div id="app"></div><div id="toast"></div>
<script>const BGV="assets/bg.webm?v=1",BGM="assets/bg.mp4?v=1";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const K='nusaops1',MODS={air:'Air Tawar',inv:'Inventory',trk:'Trucking',off:'Penawaran',kas:'Arus Kas',set:'Pengaturan'},IC={air:'💧',inv:'📦',trk:'🚚',off:'📄',kas:'💰',set:'⚙️'};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>iso(new Date()),uid=()=>Math.random().toString(36).slice(2,9);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),R=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID'),V=i=>document.getElementById(i).value,N=i=>+V(i)||0;
let D,me=null,REP=null,ST={page:'air',p:'m',ref:today(),done:false,t:{air:'dash',inv:'dash',trk:'dash',off:'x',kas:'dash',set:'prof'}},cam=null,camT=null;
function seed(){const u=new Date();u.setDate(u.getDate()+30);return{users:[{id:'u1',nama:'Super Admin',user:'super',pass:'super123',role:'super',mods:Object.keys(MODS)}],air:[],fleet:[],items:[],moves:[],drv:[],gps:[],kas:[],fb:[],cfg:{co:'Perusahaan Anda',logo:'',fee5:50000,fee10:80000,url:'',anon:'',srk:''},sub:{until:iso(u),req:[]},tpl:'',tplName:''}}
try{D=Object.assign(seed(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){D=seed()}
D.ord=D.ord||[];function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('Penyimpanan penuh/ditolak')}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
function mod(t,h){closeM();const d=document.createElement('div');d.className='md';d.id='md';d.innerHTML='<div><div class="row" style="justify-content:space-between"><h3>'+t+'</h3><button class="b s sm" onclick="closeM()">Tutup</button></div>'+h+'</div>';d.onclick=e=>{if(e.target==d)closeM()};document.body.appendChild(d)}
function closeM(){const m=document.getElementById('md');if(m)m.remove()}
/* periode */
function pr(p,ref){const d=new Date(ref+'T00:00');let a,b;if(p=='d')a=b=ref;else if(p=='w'){const x=new Date(d);x.setDate(d.getDate()-((d.getDay()+6)%7));a=iso(x);x.setDate(x.getDate()+6);b=iso(x)}else if(p=='m'){a=iso(new Date(d.getFullYear(),d.getMonth(),1));b=iso(new Date(d.getFullYear(),d.getMonth()+1,0))}else{a=d.getFullYear()+'-01-01';b=d.getFullYear()+'-12-31'}return[a,b]}
function shift(p,ref,n){const d=new Date(ref+'T00:00');if(p=='d')d.setDate(d.getDate()+n);else if(p=='w')d.setDate(d.getDate()+7*n);else if(p=='m'){d.setDate(1);d.setMonth(d.getMonth()+n)}else d.setFullYear(d.getFullYear()+n);return iso(d)}
const sel=(a,p,ref)=>{const[x,y]=pr(p,ref);return a.filter(r=>r.tgl>=x&&r.tgl<=y)};
const fee=r=>+D.cfg['fee'+r.armada]||0,sum=(a,f)=>a.reduce((s,r)=>s+f(r),0);
const st=a=>({rit:a.length,ton:sum(a,r=>r.real),rev:sum(a,r=>r.real*r.harga),fee:sum(a,fee)});
const dl=(c,p)=>p?`<em class="${c>=p?'up':'dn'}">${c>=p?'▲':'▼'} ${Math.abs((c-p)/p*100).toFixed(0)}% vs periode lalu</em>`:'<em>— belum ada pembanding</em>';
function fbar(){const L={d:'Harian',w:'Mingguan',m:'Bulanan',y:'Tahunan'};const[a,b]=pr(ST.p,ST.ref);return`<div class="card np"><div class="row">${Object.keys(L).map(k=>`<button class="b ${ST.p==k?'':'s'} sm" onclick="ST.p='${k}';render()">${L[k]}</button>`).join('')}<button class="b s sm" onclick="ST.ref=shift(ST.p,ST.ref,-1);render()">◀</button><input type="date" style="width:150px" value="${ST.ref}" onchange="ST.ref=this.value||today();render()"><button class="b s sm" onclick="ST.ref=shift(ST.p,ST.ref,1);render()">▶</button><small style="color:var(--mu)">${a} s/d ${b}</small></div></div>`}
function T(cols,rows,click){return`<div class="tw"><table><tr>${cols.map(c=>'<th>'+c[0]+'</th>').join('')}</tr>${rows.map((r,i)=>`<tr ${click?`class="c" onclick="${click}(${i})"`:''}>${cols.map(c=>'<td>'+c[1](r)+'</td>').join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" style="color:var(--mu)">Belum ada data</td></tr>`}</table></div>`}
const tabs=(pg,l)=>`<div class="tabs np">${l.map(x=>`<button class="${ST.t[pg]==x[0]?'on':''}" onclick="ST.t['${pg}']='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`;
const isS=()=>me.role=='super',isA=()=>me.role=='super'||me.role=='admin',canDel=isA;
const opts=(a,v,l)=>a.map(x=>`<option value="${E(v(x))}">${E(l(x))}</option>`).join('');
/* GPS wajib */
function gps(cb){if(!navigator.geolocation)return toast('Perangkat tidak mendukung GPS');navigator.geolocation.getCurrentPosition(p=>cb(p.coords),()=>toast('GPS WAJIB aktif & diizinkan untuk menyimpan data ini'),{enableHighAccuracy:true,timeout:15000})}
const mapA=r=>r.lat!=null?`<a href="https://maps.google.com/?q=${r.lat},${r.lon}" target="_blank" rel="noopener">📍 peta</a>`:'-';
/* export */
function csv(){if(!REP)return toast('Tidak ada data');const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const t=[REP.h,...REP.r].map(r=>r.map(q).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=REP.n+'-'+today()+'.csv';a.click()}
const rbar=()=>`<div class="row np" style="margin-bottom:10px"><button class="b s sm" onclick="csv()">⬇ Laporan CSV</button><button class="b s sm" onclick="window.print()">🖨 Cetak / Simpan PDF</button></div>`;
/* masukan pengguna */
function fbk(pg){const l=D.fb.filter(f=>f.pg==pg&&(isS()||f.u==me.id)&&(f.st=='open'||(isS()&&ST.done)));return`<div class="card np"><h3>💬 ${isS()?'Masukan Pengguna':'Pesan ke Tim Support'}</h3><div class="row"><input id="fbt" placeholder="${isS()?'Tulis catatan...':'Tulis kebutuhan / masukan / kendala...'}" style="flex:1;min-width:180px"><button class="b" onclick="fbAdd('${pg}')">Kirim</button>${isS()?`<button class="b s sm" onclick="ST.done=!ST.done;render()">${ST.done?'Sembunyikan':'Tampilkan'} yang selesai</button>`:''}</div>${l.map(f=>`<div style="border-top:1px solid var(--br);margin-top:8px;padding-top:6px"><b>${E(f.by)}</b> <small style="color:var(--mu)">${E(f.ts)}</small>: ${E(f.tx)} ${f.st=='done'?'<span class="tag g2">selesai</span>':''}${(f.rep||[]).map(r=>`<p style="margin:4px 0 0 14px"><b>${r.sup?(isS()?'Super Admin':'Tim Support'):E(r.by)}</b>: ${E(r.tx)}</p>`).join('')}<div class="row" style="margin-top:4px"><input id="r_${f.id}" placeholder="Balas..." style="flex:1;min-width:140px"><button class="b s sm" onclick="fbRep('${f.id}')">Balas</button>${isS()?(f.st=='open'?`<button class="b sm" onclick="fbSt('${f.id}','done')">Selesai (sembunyikan)</button>`:`<button class="b s sm" onclick="fbSt('${f.id}','open')">Munculkan lagi</button>`):''}</div></div>`).join('')}</div>`}
function fbAdd(pg){const t=V('fbt').trim();if(!t)return;D.fb.push({id:uid(),pg,by:me.nama,u:me.id,tx:t,st:'open',ts:today(),rep:[]});save();render()}
function fbRep(id){const t=V('r_'+id).trim();if(!t)return;const f=D.fb.find(x=>x.id==id);(f.rep=f.rep||[]).push({by:me.nama,sup:isS(),tx:t,ts:today()});save();render()}
function fbSt(id,x){D.fb.find(f=>f.id==id).st=x;save();render()}
/* ===== AIR TAWAR ===== */
const AH=['Tanggal','Kapal','PT','Supir','Armada(ton)','Realisasi(ton)','Harga/ton','Total','Fee'];const arow=r=>[r.tgl,r.kapal,r.pt,r.sup,r.armada,r.real,r.harga,r.real*r.harga,fee(r)];
const ACOLS=[['Tanggal',r=>r.tgl],['Kapal',r=>E(r.kapal)],['PT',r=>E(r.pt)],['Supir',r=>E(r.sup)],['Armada',r=>r.armada+' ton'],['Realisasi',r=>r.real+' ton'],['Harga/ton',r=>R(r.harga)],['Total',r=>R(r.real*r.harga)],['Fee',r=>R(fee(r))],['GPS',mapA],['Foto',r=>r.foto?`<a href="#" onclick="showFoto('${r.id}');return false">🖼</a>`:'-']];
function airDash(){const rows=sel(D.air,ST.p,ST.ref),a=st(rows),b=st(sel(D.air,ST.p,shift(ST.p,ST.ref,-1)));REP={n:'air-tawar',h:AH,r:rows.map(arow)};
const k=(c,l,f,x)=>`<div class="kpi ${x}" onclick="airDet('${c}')"><small>${l}</small><b>${f(a[c])}</b>${dl(a[c],b[c])}</div>`;
const g={};rows.forEach(r=>{const key=ST.p=='y'?r.tgl.slice(0,7):r.tgl.slice(5);g[key]=(g[key]||0)+r.real});const ks=Object.keys(g).sort(),mx=Math.max(1,...Object.values(g));
const grp=f=>{const m={};rows.forEach(r=>{(m[r[f]]=m[r[f]]||[]).push(r)});return Object.entries(m).map(([n,x])=>({n,f,...st(x)})).sort((p,q)=>q.rev-p.rev)};window.GP=grp('pt').concat(grp('sup'));
const gt=(l,f)=>`<div class="card"><h3>${l}</h3>${T([[l,r=>E(r.n)],['Rit',r=>r.rit],['Ton',r=>r.ton],['Pendapatan',r=>R(r.rev)],['% ',r=>(a.rev?r.rev/a.rev*100:0).toFixed(0)+'%']],GP.filter(x=>x.f==f),'airG')}</div>`;
return rbar()+todayCard()+fbar()+`<div class="g">${k('rit','Total Rit',x=>x,'')}${k('ton','Realisasi (ton)',x=>x.toFixed(1),'k4')}${k('rev','Pendapatan',R,'k2')}${k('fee','Fee Supir',R,'k3')}</div><div class="card" style="margin-top:12px"><h3>Realisasi (ton)</h3><div class="bar" style="padding-bottom:18px">${ks.map(x=>`<i style="height:${g[x]/mx*100}%" title="${g[x]}"><u>${x}</u></i>`).join('')||'<small>Belum ada data</small>'}</div></div>${kapalCard(rows)}${gt('PT','pt')}${gt('Supir','sup')}`}
function airDet(c){const L={rit:'Detail Rit',ton:'Detail Realisasi',rev:'Detail Pendapatan',fee:'Detail Fee Supir'};mod(L[c],T(ACOLS,sel(D.air,ST.p,ST.ref)))}
function airG(i){const x=window.GP[i];mod(E(x.n),T(ACOLS,sel(D.air,ST.p,ST.ref).filter(r=>r[x.f]==x.n)))}
function airIn(){if(!D.drv.length)return'<div class="card">Tambahkan supir dulu di menu Trucking → Data Supir.</div>';return`<div class="card"><h3>Input Realisasi Air Tawar</h3><div class="f"><div><label>Tanggal</label><input type="date" id="at" value="${today()}"></div><div><label>Nama Kapal</label><input id="ak" list="kl">${kl()}</div><div><label>Nama PT</label><input id="ap"></div><div><label>Supir</label><select id="as">${opts(D.drv,d=>d.nama,d=>d.nama)}</select></div><div><label>Armada tangki</label><select id="aa"><option>5</option><option>10</option></select></div><div><label>Jumlah realisasi (ton)</label><input type="number" id="ar" min="0" step="0.1"></div><div><label>Harga / ton (Rp)</label><input type="number" id="ah" min="0"></div></div><p><button class="b" onclick="airSave()">Simpan</button></p></div><div class="card">${T([...ACOLS,['',r=>canDel()?`<button class="b d sm" onclick="del('air','${r.id}')">Hapus</button> <button class="b s sm" onclick="setH('${r.id}')">Harga</button>`:'']],[...D.air].reverse().slice(0,50))}</div>`}
function airSave(){const r={id:uid(),tgl:V('at'),pt:V('ap').trim(),kapal:V('ak').trim(),sup:V('as'),armada:V('aa'),real:N('ar'),harga:N('ah')};if(!r.tgl||!r.pt||!r.kapal||r.real<=0||r.harga<=0)return toast('Lengkapi tanggal, PT, realisasi dan harga');D.air.push(r);save();toast('Tersimpan');render()}
function del(k,id){ask('Hapus data ini?',()=>{D[k]=D[k].filter(x=>x.id!=id);if(k=='items')D.moves=D.moves.filter(m=>D.items.some(i=>i.id==m.item));save();render()})}
/* ===== INVENTORY ===== */
const iname=id=>(D.items.find(i=>i.id==id)||{nama:'?'}).nama;
function invDash(){const low=D.items.filter(i=>i.stok<=i.min),loc={};D.items.forEach(i=>{(loc[i.lok||'-']=loc[i.lok||'-']||[]).push(i)});REP={n:'inventory',h:['Kode','Nama','Kategori','Stok','Min','Satuan','Lokasi'],r:D.items.map(i=>[i.kode,i.nama,i.kat,i.stok,i.min,i.sat,i.lok])};window.IV={all:D.items,low,out:D.items.filter(i=>i.stok<=0)};
const k=(c,l,v,x)=>`<div class="kpi ${x}" onclick="invDet('${c}')"><small>${l}</small><b>${v}</b></div>`;
return rbar()+`<div class="g">${k('all','Jenis Barang',D.items.length,'')}${k('low','Akan Habis',low.length,'k3')}${k('out','Habis',IV.out.length,'k2')}${k('all','Total Stok',sum(D.items,i=>i.stok),'k4')}</div><div class="card" style="margin-top:12px"><h3>⚠ Barang Hampir Habis</h3>${T(ICOLS,low)}</div><div class="card"><h3>📍 Posisi Barang</h3>${Object.entries(loc).map(([l,x])=>`<p><b>${E(l)}</b>: ${x.map(i=>E(i.nama)+' ('+i.stok+')').join(', ')}</p>`).join('')||'Belum ada data'}</div>`}
const ICOLS=[['Kode',i=>E(i.kode)],['Nama',i=>E(i.nama)],['Kategori',i=>E(i.kat)],['Stok',i=>`<b>${i.stok}</b> ${E(i.sat)}`],['Min',i=>i.min],['Lokasi',i=>E(i.lok)],['Status',i=>i.stok<=0?'<span class="tag r">Habis</span>':i.stok<=i.min?'<span class="tag r">Menipis</span>':'<span class="tag g2">Aman</span>']];

const BLN='Januari|Februari|Maret|April|Mei|Juni|Juli|Agustus|September|Oktober|November|Desember';
function detect(t){const L=t.split('\n');let co='',act='';const i=L.findIndex(l=>/^\s*kepada/i.test(l));if(i>=0){const m=L[i].split(/[:\t]/)[1];if(m&&m.trim())co=m.trim();else for(let j=i+1;j<L.length;j++){const s=L[j].trim();if(s&&!/^yth\.?$/i.test(s)){co=s.replace(/^yth\.?\s*/i,'');break}}}const a=L.map(l=>l.match(/^\s*(?:perihal|hal|kegiatan|pekerjaan)\s*:\s*(.+)/i)).find(Boolean);if(a)act=a[1].trim();const p=t.match(/Rp\.?\s?[\d.,]+/),d=t.match(new RegExp('\\b\\d{1,2}\\s+('+BLN+')\\s+\\d{4}\\b','i'))||t.match(/\b\d{1,2}[\/-]\d{1,2}[\/-]\d{4}\b/);return{co,act,pr:p?p[0]:'',dt:d?d[0]:''}}
function offPg(){const d=detect(D.tpl);return`<div class="card np"><h3>📄 Template Penawaran ${isA()?'':'(hanya admin yang unggah)'}</h3>${isA()?`<div class="row"><input type="file" id="tf" accept=".txt,.md,.html,.htm,.pdf,.docx,.xlsx,.xls,.csv" onchange="tplUp(this)" style="width:auto"><small style="color:var(--mu)">${E(D.tplName)||'Belum ada template'}</small></div>`:''}</div>${D.tpl?`<div class="card np"><h3>Sistem membaca dokumen (bisa dikoreksi)</h3><div class="f"><div><label>Perusahaan tujuan lama</label><input id="oc0" value="${E(d.co)}"></div><div><label>Harga lama</label><input id="op0" value="${E(d.pr)}"></div><div><label>Kegiatan lama</label><input id="oa0" value="${E(d.act)}"></div><div><label>Tanggal lama</label><input id="od0" value="${E(d.dt)}"></div></div><h3 style="margin-top:12px">Ganti menjadi</h3><div class="f"><div><label>Perusahaan tujuan baru</label><input id="oc1"></div><div><label>Harga baru (angka)</label><input type="number" id="op1"></div><div><label>Kegiatan baru</label><input id="oa1"></div><div><label>Tanggal (kosong = hari ini)</label><input type="date" id="od1"></div></div><p class="row"><button class="b" onclick="offGen()">Buat Penawaran</button><button class="b s" onclick="window.print()">⬇ Download PDF / Cetak</button><button class="b s" onclick="offSend()">📤 Kirim</button></p></div><div class="paper" id="paper">${E(window.OFF||D.tpl)}</div><div class="ph" style="display:none"></div>`:''}`}
async function tplUp(el){const f=el.files[0];if(!f)return;if(/\.(pdf|docx|xlsx|xls|csv)$/i.test(f.name)){try{toast('Membaca dokumen...');D.tpl=await readDoc(f)}catch(e){return toast('Gagal membaca: '+e.message)}D.tplName=f.name;window.OFF=null;save();return render()}const r=new FileReader();r.onload=()=>{let t=String(r.result);if(/\.html?$/i.test(f.name))t=t.replace(/<(script|style)[\s\S]*?<\/\1>/gi,'').replace(/<br\s*\/?>|<\/(p|div|tr|h\d|li)>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/\n{3,}/g,'\n\n');D.tpl=t;D.tplName=f.name;window.OFF=null;save();render()};r.readAsText(f)}
function offGen(){let t=D.tpl;const rp=(a,b)=>{if(a&&b)t=t.split(a).join(b)};rp(V('oc0'),V('oc1').trim());rp(V('oa0'),V('oa1').trim());if(N('op1')>0)rp(V('op0'),R(N('op1')));const dt=V('od1')?new Date(V('od1')+'T00:00'):new Date();rp(V('od0'),dt.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}));window.OFF=t;document.getElementById('paper').textContent=t;toast('Penawaran dibuat')}
function offSend(){const t=window.OFF||D.tpl;if(navigator.share)navigator.share({title:'Penawaran Harga',text:t}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(t))}

async function readDoc(f){const ab=await f.arrayBuffer(),n=f.name.toLowerCase();let out='';
if(n.endsWith('.docx')){if(!window.mammoth)throw Error('library Word belum termuat');out=(await mammoth.extractRawText({arrayBuffer:ab})).value}
else if(/\.(xlsx|xls|csv)$/.test(n)){if(!window.XLSX)throw Error('library Excel belum termuat');const w=XLSX.read(ab,{type:'array'});out=w.SheetNames.map(s=>XLSX.utils.sheet_to_csv(w.Sheets[s],{FS:'\t',blankrows:false})).join('\n\n')}
else{if(!window.pdfjsLib)throw Error('library PDF belum termuat');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:ab}).promise;for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();let y=null,l='';c.items.forEach(t=>{const yy=Math.round(t.transform[5]);if(y!==null&&Math.abs(yy-y)>3){out+=l.trim()+'\n';l=''}y=yy;l+=t.str+' '});out+=l.trim()+'\n\n'}}
if(!out.trim())throw Error('dokumen tidak berisi teks (mungkin hasil scan gambar)');return out}

function delRun(all){const ks=all?Object.keys(DSET):[...document.querySelectorAll('.dk:checked')].map(c=>c.value),a=all?'':V('d1'),b=all?'':V('d2');if(!ks.length)return toast('Pilih data dulu');ask('Hapus: '+ks.map(k=>E(DSET[k][0])).join(', ')+(a||b?' ('+(a||'…')+' s/d '+(b||'…')+')':'')+'. Tidak bisa dibatalkan.',()=>{let n=0;ks.forEach(k=>{const f=DSET[k][1],c=D[k].length;D[k]=D[k].filter(r=>{if(!f)return !!(a||b);if(!a&&!b)return false;const d=String(r[f]||'').slice(0,10);return !((!a||d>=a)&&(!b||d<=b))});n+=c-D[k].length});D.moves=D.moves.filter(m=>D.items.some(i=>i.id==m.item));save();render();toast(n+' data dihapus')},'HAPUS')}

let IMP=[];
const SYN={nama:['nama barang','nama','barang','item','material','deskripsi','description','uraian','produk','product'],stok:['stok','stock','jumlah','qty','quantity','saldo','sisa','kuantitas'],kode:['kode','kode barang','barcode','sku','code','part no','no barang'],sat:['satuan','unit','uom'],kat:['kategori','category','jenis','golongan','group'],lok:['lokasi','location','gudang','rak','posisi','tempat'],min:['minimum','min','stok minimum','batas','safety stock','reorder']};
const norm=t=>String(t).trim().toLowerCase().replace(/[\s_.\-\/]+/g,' ');
const num=v=>{if(typeof v=='number')return v;let s=String(v).trim();const m=s.match(/^-?[\d.,]+/);if(!m)return NaN;s=m[0];if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');return parseFloat(s)};
function hdrMap(row){const map={},used={},ORD=['kode','min','sat','kat','lok','stok','nama'];row.forEach((c,j)=>{const t=norm(c);if(!t)return;for(const k in SYN)if(map[k]===undefined&&SYN[k].includes(t)){map[k]=j;used[j]=1;return}});row.forEach((c,j)=>{const t=norm(c);if(!t||used[j])return;for(const k of ORD){if(map[k]===undefined&&SYN[k].some(w=>t.includes(w))){map[k]=j;used[j]=1;return}}});return map}
function parseStock(w){let best=null;const sheets=w.SheetNames.map(sn=>XLSX.utils.sheet_to_json(w.Sheets[sn],{header:1,defval:'',blankrows:false}));
sheets.forEach(rows=>{for(let i=0;i<Math.min(rows.length,20);i++){const m=hdrMap(rows[i]);if(m.nama!==undefined&&m.stok!==undefined){const sc=Object.keys(m).length;if(!best||sc>best.sc)best={sc,m,start:i+1,rows}}}});
if(best)return best;
for(const rows of sheets){if(!rows.length)continue;const n=Math.max(...rows.map(r=>r.length));let ni=-1,si=-1;for(let j=0;j<n;j++){const c=rows.map(r=>r[j]).filter(v=>String(v??'').trim()!==''),nu=c.filter(v=>typeof v=='number'||/^[\d.,]+$/.test(String(v).trim())).length;if(nu>c.length/2){if(si<0)si=j}else if(c.length&&ni<0)ni=j}if(ni>=0&&si>=0)return{m:{nama:ni,stok:si},start:isNaN(num(rows[0][si]))?1:0,rows}}
return null}
function stkBuild(b){const m=b.m,out=[],seen={},g=(r,k)=>m[k]!==undefined?String(r[m[k]]??'').trim():'';b.rows.slice(b.start).forEach(r=>{const nama=g(r,'nama');if(!nama||/^(total|jumlah)$/i.test(nama))return;const raw=r[m.stok];let q=num(raw??'');if(isNaN(q))q=0;let sat=g(r,'sat');if(!sat&&typeof raw=='string'){const u=raw.trim().match(/[a-zA-Z]+$/);if(u)sat=u[0]}const mn=m.min!==undefined?num(r[m.min]??''):NaN;const it={kode:g(r,'kode'),nama,stok:q,sat:sat||'pcs',kat:g(r,'kat'),lok:g(r,'lok'),min:isNaN(mn)?null:mn},key=(it.kode||nama).toLowerCase();if(seen[key]!==undefined)out[seen[key]]=it;else{seen[key]=out.length;out.push(it)}});return out}
const findIt=it=>D.items.find(x=>it.kode?String(x.kode).toLowerCase()==it.kode.toLowerCase():String(x.nama).toLowerCase()==it.nama.toLowerCase());
async function stkUp(el){const f=el.files[0];el.value='';if(!f)return;if(!window.XLSX)return toast('Library Excel belum termuat, muat ulang halaman');try{const w=XLSX.read(await f.arrayBuffer(),{type:'array'}),b=parseStock(w);if(!b)return toast('Kolom nama barang & jumlah tidak ditemukan');IMP=stkBuild(b);if(!IMP.length)return toast('Tidak ada data barang terbaca');const L={nama:'Nama',stok:'Stok',kode:'Kode',sat:'Satuan',kat:'Kategori',lok:'Lokasi',min:'Minimum'},hd=b.start>0?b.rows[b.start-1]:[],nw=IMP.filter(it=>!findIt(it)).length;mod('Pratinjau Impor Stok','<p>Terbaca <b>'+IMP.length+'</b> barang ('+nw+' baru, '+(IMP.length-nw)+' memperbarui stok yang ada).</p><p style="color:var(--mu)">Kolom terdeteksi: '+Object.entries(b.m).map(([k,j])=>L[k]+' ← '+E(hd[j]!==undefined&&hd[j]!==''?hd[j]:'kolom '+(j+1))).join(', ')+'</p>'+T([['Kode',i=>E(i.kode)||'(otomatis)'],['Nama',i=>E(i.nama)],['Stok',i=>i.stok+' '+E(i.sat)],['Kategori',i=>E(i.kat)],['Lokasi',i=>E(i.lok)]],IMP.slice(0,15))+(IMP.length>15?'<small>…dan '+(IMP.length-15)+' lainnya</small>':'')+'<p class="row"><button class="b" onclick="impApply()">Impor Sekarang</button><button class="b s" onclick="closeM()">Batal</button></p>')}catch(e){toast('Gagal membaca Excel: '+e.message)}}
function impApply(){let nw=0,up=0;IMP.forEach(it=>{const ex=findIt(it);if(ex){const d=it.stok-ex.stok;if(d)D.moves.push({id:uid(),tgl:today(),item:ex.id,tipe:'opname',qty:d,ket:'Impor Excel'});ex.stok=it.stok;if(it.kat)ex.kat=it.kat;if(it.lok)ex.lok=it.lok;if(it.min!==null)ex.min=it.min;up++}else{const id=uid();let kode=it.kode||'BRG-'+String(D.items.length+1).padStart(4,'0');while(D.items.some(x=>x.kode==kode))kode+='x';D.items.push({id,kode,nama:it.nama,kat:it.kat,sat:it.sat,stok:it.stok,min:it.min!==null?it.min:5,lok:it.lok});if(it.stok)D.moves.push({id:uid(),tgl:today(),item:id,tipe:'in',qty:it.stok,ket:'Stok awal (impor Excel)'});nw++}});save();closeM();render();toast(nw+' barang baru, '+up+' diperbarui')}

S('4. Dashboard & Riwayat Air Tawar',0,`<ol><li><b>Dashboard</b>: pilih Harian/Mingguan/Bulanan/Tahunan, geser tanggal dengan ◀ ▶.</li><li>Ketuk kartu angka atau baris tabel untuk melihat detail. Persentase menunjukkan perubahan dibanding periode sebelumnya.</li><li>Kartu <b>Hari ini</b> menampilkan jumlah mobil 5 ton dan 10 ton yang jalan, serta foto dokumentasi.</li><li><b>Rekap per Kapal</b>: rit truk 5 ton dan 10 ton per kapal dan PT; ketuk baris untuk melihat per supir.</li><li><b>Riwayat</b>: seluruh rit. Ketuk 🖼 untuk melihat foto, <b>Harga</b> untuk mengisi harga rit supir, <b>Hapus</b> untuk menghapus.</li></ol>`)+
S('5. Panduan Supir',0,`<div class="card"><span class="pin">📍</span> <span class="tag g2 pl">GPS aktif</span></div><ol><li>Masuk dengan akun supir. Izinkan lokasi saat browser meminta, lalu tekan <b>Aktifkan GPS</b> bila perlu.</li><li>Tanpa GPS aktif halaman terkunci. Biarkan aplikasi terbuka selama bertugas.</li><li>Pilih <b>Order kapal</b> dan <b>Armada yang dipakai</b> (5 atau 10 ton) untuk rit ini.</li><li>Isi <b>Realisasi (ton)</b>.</li><li>Tekan kolom foto, ambil <b>foto dokumentasi</b> pengisian (wajib).</li><li>Tekan <b>Simpan</b>. Rit hari ini muncul di daftar bawah.</li></ol>${tip('Jika order kapal tidak ada di daftar, tanyakan ke admin; atau pilih "ketik manual".')}`)+
S('6. Inventory',0,`<ol><li><b>Impor stok awal</b>: Daftar Barang → pilih file Excel. Contoh judul kolom: <i>Kode, Nama Barang, Jumlah, Satuan, Lokasi</i>. Periksa <b>Pratinjau</b>, lalu <b>Impor Sekarang</b>.</li><li><b>Barang Masuk / Keluar</b>: pilih tab, pilih barang, isi jumlah, <b>Simpan</b>. Stok berubah otomatis.</li><li><b>Scan Opname</b>: tekan <b>Buka Kamera</b> dan arahkan ke barcode (atau pakai alat scan/ketik kode lalu Enter). Isi stok fisik, <b>Simpan Opname</b>; selisih tercatat.</li><li><b>Dashboard</b>: lihat barang menipis, habis, dan lokasinya.</li></ol>${tip('Kamera scan butuh Chrome di Android. Jika tidak ada, pakai alat scan atau ketik kode.')}`)+
S('7. Trucking',0,`<ol><li><b>Rekap Supir</b>: pilih periode, lihat rit, ton, dan fee tiap supir; ketuk baris untuk rincian.</li><li><b>Data & Lokasi Supir</b>: kelola supir dan lihat lokasi terakhir (tautan 📍 membuka peta).</li></ol>`)+
S('8. Penawaran Harga',0,`<ol><li>Unggah dokumen contoh (PDF, Word, Excel, teks, atau HTML).</li><li>Periksa hasil deteksi: perusahaan tujuan, harga, kegiatan, tanggal lama. Perbaiki bila salah.</li><li>Isi nilai baru. Tanggal kosong = hari ini.</li><li>Tekan <b>Buat Penawaran</b>, periksa hasilnya.</li><li>Tekan <b>Download PDF / Cetak</b> lalu pilih "Simpan sebagai PDF", atau <b>Kirim</b>.</li></ol>${tip('Hasil berupa teks; tata letak asli dokumen belum ikut.')}`)+
S('9. Arus Kas & Laporan',0,`<ol><li><b>Arus Kas → Input</b>: pilih tanggal, jenis (pemasukan/pengeluaran), nama kegiatan, kategori, nominal.</li><li>Di tiap menu, tekan <b>Laporan CSV</b> (dibuka di Excel) atau <b>Cetak / Simpan PDF</b> (memakai logo & watermark perusahaan).</li></ol>`)+
S('10. Pesan ke Tim Support',0,`<ol><li>Di bagian bawah tiap menu, tulis kebutuhan atau kendala Anda lalu <b>Kirim</b>.</li><li>Balasan Tim Support muncul di bawah pesan Anda. Anda bisa membalas kembali.</li><li>Pesan yang sudah selesai disembunyikan oleh Tim Support dan bisa dimunculkan lagi bila perlu.</li></ol>`)+
S('11. Pengaturan akun & hak akses (admin)',0,`<ol><li><b>Pengaturan → Akun & Hak Akses</b>: isi nama, ID, password, role, lalu <b>Tambah</b>.</li><li>Tekan <b>Hak akses</b> pada akun untuk mencentang menu yang boleh dibuka.</li><li>Admin dapat menghapus kegiatan (rit, order, catatan barang, kas, dll.) lewat tombol <b>Hapus</b>.</li></ol>`)+
S('12. Masalah umum',0,`<ol><li><b>GPS tidak aktif</b>: nyalakan lokasi HP, izinkan lokasi untuk browser, tekan Aktifkan GPS.</li><li><b>Kamera tidak terbuka</b>: izinkan kamera di browser.</li><li><b>Data tidak muncul di perangkat lain</b>: data saat ini tersimpan per perangkat; unduh CSV sebagai cadangan.</li><li><b>Tombol tidak bereaksi</b>: muat ulang halaman.</li></ol>`)+
(su?S('13. Khusus pengelola',0,`<ol><li><b>Supabase</b>: isi URL dan key, salin SQL yang muncul ke SQL Editor Supabase, lalu jalankan.</li><li><b>Langganan</b>: setujui pengajuan pembayaran atau atur tanggal akhir akses.</li><li><b>Hapus Data</b>: centang data, isi rentang tanggal bila perlu, ketik HAPUS.</li><li><b>Masukan</b>: balas pesan pengguna, tandai selesai.</li></ol>`):''))}

const idb=(m,v)=>new Promise(r=>{try{const q=indexedDB.open('nusabg',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onerror=()=>r(null);q.onsuccess=()=>{const o=q.result.transaction('k',m=='get'?'readonly':'readwrite').objectStore('k'),x=m=='get'?o.get('bg'):m=='set'?o.put(v,'bg'):o.delete('bg');x.onsuccess=()=>r(x.result);x.onerror=()=>r(null)}}catch(e){r(null)}});
const bgDef=()=>`<video autoplay muted loop playsinline><source src="${BGM}" type="video/mp4"><source src="${BGV}" type="video/webm"></video>`;
function playBg(){const v=document.querySelector('#lbg video');if(v){v.muted=true;v.play().catch(()=>{})}}
function setBg(src,type){const e=document.getElementById('lbg');if(!e)return;e.innerHTML=type.startsWith('image')?`<img src="${src}" alt="">`:`<video autoplay muted loop playsinline src="${src}"></video>`;playBg()}
const bgCard=()=>`<div class="card"><h3>🎬 Background Halaman Login</h3><p style="color:var(--mu);margin:0 0 8px">Unggah video (.webm/.mp4) atau gambar, maksimal 10 MB. Tersimpan di perangkat ini; untuk semua perangkat, ganti file default di hosting.</p><div class="row"><input type="file" accept="video/*,image/*" onchange="bgUp(this)" style="width:auto"><button class="b s" onclick="bgReset()">Kembalikan default</button></div></div>`;
async function bgUp(el){const f=el.files[0];el.value='';if(!f)return;if(f.size>10485760)return toast('Maksimal 10 MB');if(!/^(video|image)\//.test(f.type))return toast('Format tidak didukung');await idb('set',f);toast('Background login diganti')}
async function bgReset(){await idb('del');toast('Kembali ke background default')}
/* ===== PENGATURAN ===== */
const SQLX='\n\n-- ===== Hemat Supabase =====\ncreate index if not exists air_tgl on public.air_tawar(tgl);\ncreate index if not exists kas_tgl on public.kas(tgl);\ncreate index if not exists moves_tgl on public.moves(tgl);\ncreate index if not exists gps_t on public.gps_log(t);\ninsert into storage.buckets (id,name,public) values (\'foto\',\'foto\',false) on conflict do nothing;\n-- Foto disimpan di Storage (bukan base64 di tabel); tabel hanya menyimpan foto_url.\n-- Retensi log GPS (jadwalkan dengan pg_cron): delete from public.gps_log where t < now() - interval \'30 days\';';
function sql(){const T=[['air_tawar','id text primary key,tgl date not null,kapal text,pt text,sup text,armada int,real numeric,harga numeric,ord text,lat float8,lon float8,foto_url text'],['orders','id text primary key,tgl date,kapal text,pt text,target numeric,harga numeric,done boolean default false'],['items','id text primary key,kode text unique,nama text,kat text,sat text,stok numeric,min numeric,lok text'],['moves','id text primary key,tgl date,item text,tipe text,qty numeric,ket text'],['drivers','id text primary key,nama text,hp text,plat text'],['gps_log','id text primary key,sup text,t timestamptz,lat float8,lon float8,ket text'],['kas','id text primary key,tgl date,j text,keg text,kat text,n numeric,ket text'],['feedback',"id text primary key,pg text,u text,by text,tx text,st text,rep jsonb default '[]',ts text"],['app_users','id text primary key,nama text,usr text unique,pass text,role text,mods text[]'],['subscription','id text primary key,until date,req jsonb'],['offers','id text primary key,nama text,isi text,created timestamptz']];return`-- Project: ${D.cfg.url}\n`+T.map(([n,c])=>`create table if not exists public.${n} (${c},created_at timestamptz default now());\nalter table public.${n} enable row level security;\ndrop policy if exists "app_all" on public.${n};\ncreate policy "app_all" on public.${n} for all using (true) with check (true);`).join('\n\n')+'\n\n-- Catatan: policy di atas terbuka untuk kunci anon; perketat sebelum produksi.'+SQLX}
function setPg(){const t=ST.t.set,tb=[['prof','Profil & Armada'],['acc','Akun & Hak Akses']];if(isS())tb.push(['sb','Supabase'],['sub','Langganan'],['del','Hapus Data']);let h=tabs('set',tb);
if(t=='prof')h+=`<div class="card"><h3>Profil, Logo & Tarif Fee</h3><div class="f"><div><label>Nama perusahaan</label><input id="pc" value="${E(D.cfg.co)}"></div><div><label>Logo / watermark (untuk laporan)</label><input type="file" accept="image/*" onchange="logoUp(this)"></div><div><label>Fee per rit – 5 ton (Rp)</label><input type="number" id="f5" value="${D.cfg.fee5}"></div><div><label>Fee per rit – 10 ton (Rp)</label><input type="number" id="f10" value="${D.cfg.fee10}"></div></div><p><button class="b" onclick="profSave()">Simpan</button> ${D.cfg.logo?'<img src="'+D.cfg.logo+'" height="40" style="vertical-align:middle">':''}</p></div>`+(D.cfg.saved?fleetCard():'<p style="color:var(--mu)">Simpan data perusahaan dulu untuk membuka pengaturan armada.</p>');
if(t=='prof'&&isS())h+=bgCard();if(t=='sb')h+=`<div class="card"><h3>Hubungkan Supabase</h3>${isS()?`<div class="f"><div><label>Project URL</label><input id="su" value="${E(D.cfg.url)}" placeholder="https://xxxx.supabase.co"></div><div><label>Anon key</label><input id="sa" value="${E(D.cfg.anon)}"></div><div><label>Service role key</label><input type="password" id="sr" value="${E(D.cfg.srk)}"></div></div><p><button class="b" onclick="sbSave()">Simpan</button></p><small style="color:var(--mu)">Service role key sangat sensitif; tersimpan di browser ini saja.</small>`:'Hanya Super Admin.'}${D.cfg.url&&D.cfg.anon?`<h3 style="margin-top:12px">SQL – salin lalu jalankan di Supabase → SQL Editor</h3><button class="b s sm" onclick="navigator.clipboard.writeText(document.getElementById('sqlb').textContent).then(()=>toast('SQL disalin'))">Salin SQL</button><pre class="sql" id="sqlb">${E(sql())}</pre>`:'<p>Isi URL & anon key, maka SQL muncul otomatis.</p>'}</div>`;
if(t=='acc')h+=`<div class="card np"><h3>Tambah Akun</h3><div class="f"><div><label>Nama</label><input id="un"></div><div><label>Username</label><input id="uu"></div><div><label>Password</label><input id="up"></div><div><label>Role</label><select id="ur">${isS()?'<option value="admin">Admin</option>':''}<option value="petugas">Petugas</option><option value="supir">Supir</option></select></div><div><label>Terkait supir (role Supir)</label><select id="ud"><option value="">-</option>${opts(D.drv,d=>d.id,d=>d.nama)}</select></div></div><p><button class="b" onclick="usrAdd()">Tambah</button></p></div><div class="card">${T([['Nama',u=>E(u.nama)],['User',u=>E(u.user)],['Role',u=>u.role],['Akses',u=>u.mods.map(m=>MODS[m]).join(', ')],['',u=>u.role=='super'||u.id==me.id?'':`<button class="b sm" onclick="usrEdit('${u.id}')">Hak akses</button> <button class="b d sm" onclick="del('users','${u.id}')">Hapus</button>`]],D.users.filter(u=>isS()||u.role!='super'))}</div>`;
if(t=='sub'&&isS()){const rq=D.sub.req;h+=`<div class="card"><h3>Masa Akses</h3><div class="row"><input type="date" id="sd" value="${D.sub.until}" style="width:160px"><button class="b" onclick="D.sub.until=V('sd');save();render()">Ubah</button><small>Non-super terkunci setelah tanggal ini.</small></div></div><div class="card"><h3>Pengajuan Pembayaran</h3>${T([['Tanggal',r=>r.tgl],['Oleh',r=>E(r.by)],['Durasi',r=>r.days+' hari'],['Nominal',r=>R(r.n)],['Catatan',r=>E(r.note)],['Status',r=>r.st],['',r=>r.st=='menunggu'?`<button class="b sm" onclick="subAct('${r.id}',1)">Setujui</button> <button class="b d sm" onclick="subAct('${r.id}',0)">Tolak</button>`:'']],[...rq].reverse())}</div>`}if(t=='del'&&isS())h+=delPg();return h+fbk('set')}
function logoUp(el){const f=el.files[0],r=new FileReader();r.onload=()=>{D.cfg.logo=r.result;save();render()};if(f)r.readAsDataURL(f)}
function profSave(){D.cfg.saved=true;D.cfg.co=V('pc');D.cfg.fee5=N('f5');D.cfg.fee10=N('f10');save();toast('Tersimpan');render()}
function sbSave(){D.cfg.url=V('su').trim();D.cfg.anon=V('sa').trim();D.cfg.srk=V('sr').trim();save();render()}
function usrAdd(){const u=V('uu').trim();if(!u||!V('up')||!V('un').trim())return toast('Lengkapi data');if(D.users.some(x=>x.user==u))return toast('Username sudah dipakai');const sp=V('ur')=='supir';if(sp&&!V('ud'))return toast('Pilih data supir');D.users.push({id:uid(),nama:V('un'),user:u,pass:V('up'),role:V('ur'),drv:V('ud'),mods:sp?['air']:['air','inv','trk','kas']});save();render()}
function usrEdit(id){const u=D.users.find(x=>x.id==id);mod('Hak akses '+E(u.nama),`<label>Role</label><select id="er">${isS()?`<option ${u.role=='admin'?'selected':''} value="admin">Admin</option>`:''}<option ${u.role=='petugas'?'selected':''} value="petugas">Petugas</option><option ${u.role=='supir'?'selected':''} value="supir">Supir</option></select><p>${Object.keys(MODS).map(m=>`<label style="color:var(--tx)"><input type="checkbox" style="width:auto" class="em" value="${m}" ${u.mods.includes(m)?'checked':''}> ${MODS[m]}</label>`).join('')}</p><button class="b" onclick="usrSave('${id}')">Simpan</button>`)}
function usrSave(id){const u=D.users.find(x=>x.id==id);u.role=V('er');u.mods=[...document.querySelectorAll('.em:checked')].map(c=>c.value);save();closeM();render()}
function subAct(id,ok){const r=D.sub.req.find(x=>x.id==id);r.st=ok?'disetujui':'ditolak';if(ok){const b=new Date(Math.max(new Date(D.sub.until+'T00:00'),new Date(today()+'T00:00')));b.setDate(b.getDate()+r.days);D.sub.until=iso(b)}save();render()}
/* ===== SHELL ===== */
const locked=()=>me.role!='super'&&D.sub.until<today();
function login(){document.getElementById('app').innerHTML=`<div id="lbg">${bgDef()}</div><div class="login card gl"><h2>💧 NusaOps</h2><p style="color:var(--mu)">Air tawar · Inventory · Trucking</p><label>Username</label><input id="lu"><label style="margin-top:8px">Password</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')doLogin()"><p><button class="b" style="width:100%" onclick="doLogin()">Masuk</button></p><p style="text-align:center"><button class="b s" onclick="guide()">📖 Buku Panduan</button></p></div>`;playBg();idb('get').then(b=>{if(b)setBg(URL.createObjectURL(b),b.type)})}
function doLogin(){const u=D.users.find(x=>x.user==V('lu').trim()&&x.pass==V('lp'));if(!u)return toast('Username/password salah');me=u;ST.page=u.mods[0]||'air';if(u.role=='supir')startWatch();render()}
function lockPg(){const mine=D.sub.req.filter(r=>r.by==me.nama).slice(-3);document.getElementById('app').innerHTML=`<div class="login card"><h2>🔒 Akses Berakhir</h2><p>Masa akses habis pada ${D.sub.until}. Ajukan pembayaran agar pihak pengelola dapat memproses perpanjangan.</p><label>Durasi (hari)</label><input id="rd" type="number" value="30"><label>Nominal dibayar</label><input id="rn" type="number"><label>Catatan / bukti bayar</label><input id="rk"><p><button class="b" onclick="subReq()">Ajukan</button> <button class="b s" onclick="me=null;render()">Keluar</button></p>${mine.map(r=>`<p>${r.tgl}: ${r.days} hari – <span class="tag">${r.st}</span></p>`).join('')}</div>`}
function subReq(){D.sub.req.push({id:uid(),tgl:today(),by:me.nama,days:N('rd')||30,n:N('rn'),note:V('rk'),st:'menunggu'});save();toast('Pengajuan terkirim');lockPg()}
function render(){camStop();closeM();if(!me||me.role!='supir')stopWatch();if(!me)return login();if(locked())return lockPg();const allowed=Object.keys(MODS).filter(m=>isS()||me.mods.includes(m));if(!allowed.includes(ST.page))ST.page=allowed[0];REP=null;const pg=ST.page,t=ST.t[pg];let h='';
if(me.role=='supir')h=supirPg();else if(pg=='air')h=tabs('air',[['dash','Dashboard'],['ord','Order & Pergerakan'],['in','Riwayat']])+(t=='in'?airHist():t=='ord'?ordPg():airDash());
if(pg=='inv')h=tabs('inv',[['dash','Dashboard'],['in','Barang Masuk'],['out','Barang Keluar'],['list','Daftar Barang'],['scan','Scan Opname']])+(t=='in'?invMv('in'):t=='out'?invMv('out'):t=='list'?invList():t=='scan'?invScan():invDash());
if(pg=='trk')h=tabs('trk',[['dash','Rekap Supir'],['in','Data & Lokasi Supir']])+(t=='in'?trkIn():trkDash());
if(pg=='kas')h=kasPg();if(pg=='off')h=offPg();if(pg=='set')h=setPg();
if(pg!='set')h+=fbk(pg);
const days=Math.ceil((new Date(D.sub.until+'T00:00')-new Date(today()+'T00:00'))/864e5);
document.getElementById('wm').style.backgroundImage=D.cfg.logo?`url(${D.cfg.logo})`:'none';
document.getElementById('app').innerHTML=`<nav id="nav">${allowed.map(m=>`<button class="${pg==m?'on':''}" onclick="ST.page='${m}';render()"><span>${IC[m]}</span>${MODS[m]}</button>`).join('')}<button onclick="me=null;render()"><span>🚪</span>Keluar</button></nav><div id="main"><div class="row np" style="justify-content:space-between"><h2>${IC[pg]} ${MODS[pg]}</h2><small style="color:var(--mu)">${E(me.nama)} · ${me.role} · ${isS()?'akses '+days+' hari':''}</small> <button class="b s sm" onclick="myAcc()">👤 Akun Saya</button> <button class="b s sm" onclick="guide()">📖 Panduan</button></div><div class="ph">${D.cfg.logo?`<img src="${D.cfg.logo}">`:''}<div><b>${E(D.cfg.co)}</b><br>${MODS[pg]} · dicetak ${today()}</div></div>${h}</div>`}
render();
</script></body></html>
